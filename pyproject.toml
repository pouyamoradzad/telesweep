[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telesweep"
version = "1.0.0"
description = "Automatically clean worthless Telegram chats — local, secure, and dry-run by default."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "TeleSweep contributors" }]
keywords = ["telegram", "cleanup", "privacy", "telethon", "mtproto", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Persian",
    "Natural Language :: Arabic",
    "Natural Language :: German",
    "Natural Language :: Spanish",
    "Natural Language :: French",
    "Natural Language :: Russian",
    "Natural Language :: Turkish",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "telethon>=1.36",
    "textual>=0.52",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "aiofiles>=23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.0",
]

[project.urls]
Homepage = "https://github.com/pouyamoradzad/telesweep"
Issues = "https://github.com/pouyamoradzad/telesweep/issues"

[project.scripts]
telesweep = "main:main"

[tool.setuptools]
packages = ["telesweep"]
py-modules = ["main"]

[tool.setuptools.package-data]
telesweep = ["locales/*.json"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length is handled by formatting
    "B008",   # function calls in argument defaults (FastAPI style)
    "UP036",  # version block checks
    "UP045",  # Optional[X] is fine; we support Python 3.9
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
